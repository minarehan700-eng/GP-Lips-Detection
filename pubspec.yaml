name: lips_offline
description: Offline lips detection using MediaPipe Face Landmarker (lipsing + visemes A–E).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+1
  image: ^4.3.0
  flutter_animate: ^4.5.2
  shared_preferences: ^2.3.2
  # Hashing only - used to store the app-lock PIN and to sign practice
  # history. Pure Dart, maintained by the Dart team, no native code.
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test-only. `camera` already pins this; naming it here lets the encoder
  # tests build a real CameraImage instead of relying on a transitive package.
  camera_platform_interface: ^2.13.1

flutter:
  uses-material-design: true
  # Turns the .arb files under lib/l10n into AppLocalizations at build time.
  generate: true
