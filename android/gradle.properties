# Memory given to the Gradle build. MediaPipe is a large native dependency,
# so the build needs more than the default.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# ---------------------------------------------------------------------------
# There are deliberately NO machine-specific settings in this file.
#
# Gradle 8.14 and the Android Gradle Plugin need JDK 17 or newer. When the
# `java` on your PATH is older — Java 8 is still common — the build stops with:
#
#     Dependency requires at least JVM runtime version 11.
#     This build uses a Java 8 JVM.
#
# The fix is NOT to add a JDK path here. Tell the Flutter tool instead, once:
#
#     flutter config --jdk-dir "<path to a JDK 17>"
#
# Flutter then hands that JDK to Gradle on every build, and the setting lives
# in your own Flutter config rather than in a file shared with everyone else.
# The setup scripts (setup_windows.bat, ./setup_macos_linux.sh) find a
# suitable JDK and run that command for you.
#
# Earlier versions of this file carried a JDK path and an SSL truststore path
# belonging to one Windows machine. Both are gone: they made the build fail on
# every other computer. If antivirus intercepts HTTPS on your machine and
# Gradle downloads fail with a certificate error, see "Common Errors and
# Solutions" in README.md for the truststore settings to add locally.
# ---------------------------------------------------------------------------
