# Memory given to the Gradle build. MediaPipe is a large native dependency,
# so the build needs more than the default.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# ---------------------------------------------------------------------------
# MACHINE-SPECIFIC SETTINGS — the three lines below describe ONE Windows
# development machine. They are not part of the app.
#
# On any other computer (or on macOS/Linux) DELETE or edit them, otherwise
# Gradle will fail with "Value ... for org.gradle.java.home does not exist"
# or a truststore error. See the Troubleshooting section of the README.
# ---------------------------------------------------------------------------

# Point Gradle at the JDK bundled with Android Studio, because the system PATH
# on that machine still defaults to an old Java 8.
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr

# That machine runs AVG antivirus, which inspects HTTPS traffic by presenting
# its own certificate authority. Windows trusts it, but Java keeps a separate
# list, so Gradle is pointed at a copy that includes the AVG certificate.
# "changeit" is the standard default password for a Java keystore, not a
# private password.
systemProp.javax.net.ssl.trustStore=C\:\\Users\\Mina Rehan\\.gradle\\ssl-truststore.jks
systemProp.javax.net.ssl.trustStorePassword=changeit
